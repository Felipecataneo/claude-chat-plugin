<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>context-chat — demo</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0e1320; color: #cdd6e2;
           font-family: system-ui, sans-serif; display: grid; place-items: center; }
    .slide { text-align: center; padding: 40px; }
    h1 { font-size: clamp(28px, 5vw, 56px); margin: 0 0 12px; color: #eef3fa; }
    p { color: #7c8aa0; }
  </style>
</head>
<body>
  <div class="slide">
    <h1>Obrigado · Perguntas</h1>
    <p>Clique em "Q&amp;A com IA" no canto. Use o ⛶ para tela cheia (ESC sai).</p>
    <p style="font-size:13px;color:#4a5a72">backend em <code>http://localhost:8000</code></p>
  </div>

  <script src="context-chat.js"></script>
  <context-chat endpoint="http://localhost:8000/api/v1/presentation/chat" title="Q&A com IA"></context-chat>
</body>
</html>
